name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify node_modules assets
        run: |
          for f in \
            app/src/main/assets/node_modules/fuse.js/dist/fuse.min.js \
            app/src/main/assets/node_modules/tus-js-client/dist/tus.min.js \
            app/src/main/assets/node_modules/dayjs/dayjs.min.js \
            app/src/main/assets/node_modules/dayjs/plugin/relativeTime.js \
            app/src/main/assets/node_modules/wavesurfer.js/dist/wavesurfer.min.js ; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; exit 1; fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
  run: |
    set +e
    gradle assembleDebug --no-daemon 2>&1 | tee build.log
    ec=${PIPESTATUS[0]}
    echo ""
    echo "==================== ERRORS ===================="
    grep -n -B 1 -A 4 "error:" build.log | head -100
    echo "==================== FAILED TASK ===================="
    grep -n "FAILED" build.log | head -20
    echo "==================== END ===================="
    exit $ec

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
